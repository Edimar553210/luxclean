<!DOCTYPE html>
<html lang="pt-PT">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Limpeza Profissional em Almada | LuxClean</title>

<meta name="description" content="Limpeza profissional em Almada com atendimento premium. Limpeza residencial, escritórios, condomínios, pós-obra e higienização de sofás.">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

html{
scroll-behavior:smooth;
}

body{
background:#eef8fc;
color:#082033;
overflow-x:hidden;
}

a{
text-decoration:none;
}

img{
max-width:100%;
display:block;
}

.container{
width:min(1180px,92%);
margin:auto;
}

.header{
position:sticky;
top:0;
z-index:999;
background:rgba(255,255,255,.94);
backdrop-filter:blur(18px);
box-shadow:0 12px 35px rgba(0,60,100,.08);
}

.header-inner{
display:flex;
align-items:center;
justify-content:space-between;
padding:18px 0;
gap:20px;
}

.brand{
display:flex;
align-items:center;
gap:14px;
color:#082033;
}

.brand-logo{
width:78px;
height:58px;
object-fit:contain;
border-radius:14px;
}

.brand-title{
font-size:34px;
font-weight:900;
line-height:1;
letter-spacing:-1px;
}

.brand-subtitle{
font-size:16px;
font-weight:700;
color:#617886;
margin-top:6px;
}

.header-actions{
display:flex;
align-items:center;
gap:12px;
}

.lang-btn{
width:64px;
height:64px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:900;
}

.lang-active{
background:#08699d;
color:white;
box-shadow:0 12px 28px rgba(8,105,157,.25);
}

.lang-outline{
border:2px solid #c8dce8;
color:#0b3754;
background:white;
}

.hero{
position:relative;
padding:92px 0 95px;
background:
radial-gradient(circle at 12% 15%,rgba(25,190,230,.18),transparent 30%),
linear-gradient(180deg,#f9fdff 0%,#eef8fc 100%);
overflow:hidden;
}

.hero::before{
content:"";
position:absolute;
top:-120px;
right:-120px;
width:380px;
height:380px;
border-radius:50%;
background:rgba(13,158,210,.13);
}

.hero::after{
content:"";
position:absolute;
bottom:-180px;
left:-130px;
width:420px;
height:420px;
border-radius:50%;
background:rgba(0,100,150,.08);
}

.hero-grid{
position:relative;
z-index:2;
display:grid;
grid-template-columns:1.05fr .95fr;
gap:46px;
align-items:center;
}

.kicker{
display:inline-flex;
align-items:center;
gap:10px;
background:#ffffff;
border:1px solid rgba(8,105,157,.12);
box-shadow:0 12px 28px rgba(0,65,100,.08);
padding:12px 18px;
border-radius:999px;
font-size:13px;
font-weight:900;
letter-spacing:.12em;
color:#0873a9;
margin-bottom:24px;
}

.kicker-dot{
width:10px;
height:10px;
background:#19c4e8;
border-radius:50%;
box-shadow:0 0 0 7px rgba(25,196,232,.13);
}

.hero-title{
font-size:62px;
line-height:1.02;
letter-spacing:-2.4px;
font-weight:900;
color:#06253a;
margin-bottom:24px;
}

.hero-title span{
color:#0879b5;
}

.hero-text{
font-size:20px;
line-height:1.8;
color:#526e7e;
max-width:680px;
margin-bottom:32px;
}

.hero-buttons{
display:flex;
gap:14px;
flex-wrap:wrap;
align-items:center;
}

.btn{
display:inline-flex;
align-items:center;
justify-content:center;
gap:10px;
border-radius:999px;
padding:18px 30px;
font-size:17px;
font-weight:900;
transition:.25s;
border:0;
cursor:pointer;
}

.btn:hover{
transform:translateY(-3px);
}

.btn-green{
background:#25D366;
color:white;
box-shadow:0 18px 40px rgba(37,211,102,.32);
}

.btn-blue{
background:#073a58;
color:white;
box-shadow:0 18px 40px rgba(7,58,88,.18);
}

.btn-light{
background:white;
color:#073a58;
box-shadow:0 15px 35px rgba(0,55,90,.09);
}

.trust-row{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:14px;
margin-top:34px;
max-width:680px;
}

.trust-card{
background:white;
border:1px solid rgba(8,105,157,.1);
box-shadow:0 12px 30px rgba(0,65,100,.07);
border-radius:22px;
padding:18px;
}

.trust-card strong{
display:block;
font-size:23px;
font-weight:900;
color:#073a58;
}

.trust-card span{
font-size:13px;
font-weight:700;
color:#647987;
}

.visual-card{
background:white;
padding:14px;
border-radius:42px;
box-shadow:0 35px 80px rgba(0,60,95,.16);
position:relative;
overflow:hidden;
}

.visual-badge{
position:absolute;
z-index:3;
left:30px;
top:30px;
background:rgba(255,255,255,.92);
backdrop-filter:blur(12px);
border-radius:24px;
padding:18px 20px;
box-shadow:0 16px 40px rgba(0,0,0,.12);
}

.visual-badge strong{
display:block;
font-size:18px;
color:#073a58;
font-weight:900;
}

.visual-badge span{
font-size:13px;
font-weight:700;
color:#607584;
}

.visual-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
border-radius:32px;
overflow:hidden;
}

.visual-grid img{
width:100%;
height:245px;
object-fit:cover;
}

.visual-grid img:nth-child(1){
grid-row:span 2;
height:500px;
}

.section{
padding:92px 0;
}

.section-white{
background:white;
}

.section-blue{
background:
radial-gradient(circle at 85% 12%,rgba(25,196,232,.22),transparent 25%),
linear-gradient(135deg,#042d43,#075f82 55%,#064664);
color:white;
}

.section-head{
max-width:820px;
margin:0 auto 50px;
text-align:center;
}

.eyebrow{
font-size:13px;
font-weight:900;
letter-spacing:.18em;
text-transform:uppercase;
color:#0b84bd;
margin-bottom:13px;
}

.section-blue .eyebrow{
color:#27d6ff;
}

.section-title{
font-size:46px;
line-height:1.12;
letter-spacing:-1.5px;
font-weight:900;
color:#082033;
}

.section-blue .section-title{
color:white;
}

.section-text{
margin-top:18px;
font-size:18px;
line-height:1.85;
color:#607584;
}

.section-blue .section-text{
color:#cdeef8;
}

.cards{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:22px;
}

.card{
background:white;
border:1px solid rgba(8,105,157,.08);
border-radius:30px;
padding:30px;
box-shadow:0 18px 45px rgba(0,60,100,.08);
transition:.25s;
}

.card:hover{
transform:translateY(-5px);
box-shadow:0 25px 60px rgba(0,60,100,.12);
}

.card-icon{
width:58px;
height:58px;
border-radius:20px;
background:#e4f7ff;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
margin-bottom:20px;
}

.card h3{
font-size:22px;
font-weight:900;
color:#082033;
margin-bottom:12px;
}

.card p{
font-size:16px;
line-height:1.75;
color:#607584;
}

.premium-box{
background:white;
border-radius:38px;
box-shadow:0 25px 65px rgba(0,60,100,.1);
overflow:hidden;
display:grid;
grid-template-columns:.95fr 1.05fr;
}

.premium-image{
background:url('galeria-1.jpg') center/cover no-repeat;
min-height:520px;
}

.premium-content{
padding:54px;
}

.premium-content h2{
font-size:42px;
line-height:1.15;
letter-spacing:-1px;
font-weight:900;
margin-bottom:20px;
color:#082033;
}

.premium-content p{
font-size:18px;
line-height:1.85;
color:#607584;
margin-bottom:26px;
}

.check-list{
display:grid;
gap:14px;
}

.check-item{
display:flex;
align-items:flex-start;
gap:12px;
font-size:16px;
font-weight:700;
color:#25495d;
}

.check{
width:25px;
height:25px;
border-radius:50%;
background:#25D366;
color:white;
display:flex;
align-items:center;
justify-content:center;
font-size:14px;
font-weight:900;
flex:none;
}

.steps{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:22px;
}

.step{
background:rgba(255,255,255,.1);
border:1px solid rgba(255,255,255,.18);
border-radius:30px;
padding:30px;
backdrop-filter:blur(10px);
}

.step-number{
font-size:34px;
font-weight:900;
color:#28d8ff;
margin-bottom:18px;
}

.step h3{
font-size:22px;
font-weight:900;
margin-bottom:12px;
}

.step p{
font-size:16px;
line-height:1.75;
color:#d3f1fa;
}

.areas{
display:flex;
flex-wrap:wrap;
gap:13px;
justify-content:center;
}

.area-pill{
background:white;
border:1px solid rgba(8,105,157,.08);
box-shadow:0 12px 28px rgba(0,60,100,.07);
border-radius:999px;
padding:14px 22px;
font-weight:900;
color:#073a58;
}

.form-wrap{
display:grid;
grid-template-columns:.9fr 1.1fr;
gap:32px;
align-items:stretch;
}

.form-info{
background:
linear-gradient(135deg,rgba(4,45,67,.94),rgba(7,95,130,.95)),
url('servico-2.jpg') center/cover no-repeat;
border-radius:38px;
padding:42px;
color:white;
box-shadow:0 25px 65px rgba(0,60,100,.15);
}

.form-info .eyebrow{
color:#28d8ff;
}

.form-info h2{
font-size:40px;
line-height:1.12;
font-weight:900;
margin-bottom:18px;
}

.form-info p{
font-size:17px;
line-height:1.8;
color:#d5f2fa;
margin-bottom:24px;
}

.form-mini{
display:grid;
gap:13px;
margin-top:24px;
}

.form-mini div{
background:rgba(255,255,255,.11);
border:1px solid rgba(255,255,255,.18);
border-radius:20px;
padding:16px;
font-weight:800;
}

.form-card{
background:white;
border-radius:38px;
padding:38px;
box-shadow:0 25px 65px rgba(0,60,100,.11);
border:1px solid rgba(8,105,157,.08);
}

.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;
}

.field{
display:flex;
flex-direction:column;
gap:8px;
}

.field-full{
grid-column:1/-1;
}

label{
font-size:14px;
font-weight:900;
color:#073a58;
}

input,
select,
textarea{
width:100%;
border:1px solid #d7e8ef;
background:#f7fcff;
border-radius:18px;
padding:16px;
font-size:16px;
outline:none;
color:#082033;
}

textarea{
min-height:125px;
resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
border-color:#0b84bd;
box-shadow:0 0 0 4px rgba(11,132,189,.12);
}

.submit{
width:100%;
margin-top:20px;
background:#25D366;
color:white;
border:0;
border-radius:999px;
padding:18px;
font-size:18px;
font-weight:900;
cursor:pointer;
box-shadow:0 18px 40px rgba(37,211,102,.28);
}

.gallery{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px;
}

.gallery-item{
border-radius:30px;
overflow:hidden;
box-shadow:0 18px 45px rgba(0,60,100,.08);
background:white;
}

.gallery-item img{
width:100%;
height:260px;
object-fit:cover;
}

.gallery-item div{
padding:20px;
}

.gallery-item h3{
font-size:20px;
font-weight:900;
color:#082033;
margin-bottom:8px;
}

.gallery-item p{
font-size:15px;
line-height:1.65;
color:#607584;
}

.final-cta{
background:
radial-gradient(circle at 15% 15%,rgba(37,211,102,.22),transparent 28%),
linear-gradient(135deg,#042d43,#064d70);
border-radius:42px;
padding:56px;
color:white;
text-align:center;
box-shadow:0 28px 75px rgba(0,60,100,.18);
}

.final-cta h2{
font-size:44px;
line-height:1.15;
font-weight:900;
margin-bottom:18px;
}

.final-cta p{
font-size:18px;
line-height:1.8;
max-width:760px;
margin:0 auto 30px;
color:#d5f2fa;
}

.footer{
background:#061c2b;
color:white;
text-align:center;
padding:46px 20px 105px;
}

.footer h2{
font-size:28px;
font-weight:900;
margin-bottom:10px;
}

.footer p{
opacity:.75;
line-height:1.8;
}

.fixed-whatsapp{
position:fixed;
left:18px;
right:18px;
bottom:16px;
z-index:999;
background:#25D366;
color:white;
border-radius:999px;
padding:18px 22px;
font-size:22px;
font-weight:900;
text-align:center;
box-shadow:0 18px 45px rgba(0,0,0,.24);
}

@media(max-width:980px){

.hero-grid{
grid-template-columns:1fr;
}

.hero-title{
font-size:48px;
}

.visual-grid img:nth-child(1){
height:320px;
}

.visual-grid img{
height:160px;
}

.cards,
.steps{
grid-template-columns:1fr 1fr;
}

.premium-box{
grid-template-columns:1fr;
}

.form-wrap{
grid-template-columns:1fr;
}

.gallery{
grid-template-columns:1fr;
}

}

@media(max-width:640px){

.container{
width:min(100% - 34px,1180px);
}

.header-inner{
padding:14px 0;
}

.brand-logo{
width:70px;
height:52px;
}

.brand-title{
font-size:31px;
}

.brand-subtitle{
font-size:15px;
}

.lang-btn{
width:58px;
height:58px;
font-size:21px;
}

.hero{
padding:62px 0 72px;
}

.hero-title{
font-size:42px;
letter-spacing:-1.4px;
}

.hero-text{
font-size:18px;
}

.hero-buttons{
display:grid;
grid-template-columns:1fr;
}

.btn{
width:100%;
padding:18px 20px;
}

.trust-row{
grid-template-columns:1fr;
}

.visual-card{
border-radius:32px;
padding:10px;
}

.visual-grid{
grid-template-columns:1fr 1fr;
gap:7px;
border-radius:25px;
}

.visual-grid img:nth-child(1){
grid-row:auto;
height:180px;
}

.visual-grid img{
height:180px;
}

.visual-badge{
display:none;
}

.section{
padding:72px 0;
}

.section-title{
font-size:35px;
}

.cards,
.steps{
grid-template-columns:1fr;
}

.premium-content{
padding:32px;
}

.premium-content h2{
font-size:34px;
}

.premium-image{
min-height:300px;
}

.form-card{
padding:28px;
}

.form-grid{
grid-template-columns:1fr;
}

.form-info{
padding:32px;
}

.form-info h2{
font-size:34px;
}

.final-cta{
padding:38px 24px;
border-radius:32px;
}

.final-cta h2{
font-size:34px;
}

.fixed-whatsapp{
font-size:20px;
padding:17px;
}

}

</style>
</head>

<body>

<header class="header">
<div class="container header-inner">

<a class="brand" href="index.html">
<img class="brand-logo" src="luxclean-logo.png" alt="LuxClean">
<div>
<div class="brand-title">LuxClean</div>
<div class="brand-subtitle">Limpeza Profissional</div>
</div>
</a>

<div class="header-actions">
<div class="lang-btn lang
